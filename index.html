<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Расписание</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>Расписание занятий</h1>
        <nav class="mobile-day-switcher" aria-label="Выбор дня расписания">
          <button id="previous-day" type="button" aria-label="Предыдущий день">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <strong id="mobile-day-label"></strong>
          <button id="next-day" type="button" aria-label="Следующий день">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
          <button id="automatic-day" type="button" aria-label="Вернуться к автоматическому выбору дня">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0 2 5.3M20 4v7h-7" /></svg>
          </button>
        </nav>
      </header>

      <section class="user-picker" aria-label="Выбор расписания">
        <label for="username-select">Студент</label>
        <select id="username-select" name="username">
          <option value="@yamenai">@yamenai</option>
        </select>
        <button id="show-schedule" type="button">Показать расписание</button>
      </section>

      <p id="schedule-info" role="status"></p>
      <div class="schedule-layout">
        <div class="table-wrap">
          <table id="schedule-table">
          <caption>Общее и персональное расписание</caption>
          <thead>
            <tr>
              <th scope="col">Время</th>
              <th scope="col" data-day="Понедельник">Понедельник</th>
              <th scope="col" data-day="Вторник">Вторник</th>
              <th scope="col" data-day="Среда">Среда</th>
              <th scope="col" data-day="Четверг">Четверг</th>
              <th scope="col" data-day="Пятница">Пятница</th>
              <th scope="col" data-day="Суббота">Суббота</th>
            </tr>
            </thead>
            <tbody id="schedule-body"></tbody>
          </table>
        </div>
        <nav class="desktop-day-switcher" aria-label="Выбор дня расписания">
          <button type="button" data-all-days>Вся неделя</button>
          <button type="button" data-desktop-day="Понедельник">Пн</button>
          <button type="button" data-desktop-day="Вторник">Вт</button>
          <button type="button" data-desktop-day="Среда">Ср</button>
          <button type="button" data-desktop-day="Четверг">Чт</button>
          <button type="button" data-desktop-day="Пятница">Пт</button>
          <button type="button" data-desktop-day="Суббота">Сб</button>
        </nav>
      </div>
    </main>

    <template id="lesson-template">
      <article class="lesson">
        <strong class="lesson-title"></strong>
        <span class="lesson-details"></span>
      </article>
    </template>

    <dialog id="group-dialog" aria-labelledby="group-dialog-title">
      <header class="group-dialog-header">
        <div>
          <p class="dialog-kicker">Твоя группа</p>
          <h2 id="group-dialog-title"></h2>
        </div>
        <button id="close-group-dialog" type="button" aria-label="Закрыть окно">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </header>
      <p id="group-dialog-tags" class="group-dialog-tags"></p>
      <ul id="group-members" class="group-members"></ul>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
